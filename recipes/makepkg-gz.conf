# makepkg config used by install.sh (via MAKEPKG_CONF) for every package it
# builds. The system-wide /etc/makepkg.conf stays untouched.
source /etc/makepkg.conf

# GCC 16 defaults to C++20, which breaks this old code
export CC=gcc-15 CXX=g++-15
# GCC 15 no longer includes <cstdint> transitively
CXXFLAGS+=" --include=cstdint"
# Eigen 5 CMake config no longer exports EIGEN3_INCLUDE_DIRS
CXXFLAGS+=" -isystem /usr/include/eigen3"
